<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oefentoets Organen van planten</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f7f2; --card:#ffffff; --text:#1d2a1f; --muted:#5a6b5d; --border:#cfdacb;
  --accent:#2e7d32; --accent-text:#ffffff; --ok:#1b7a2f; --ok-bg:#e3f5e6;
  --bad:#b3261e; --bad-bg:#fdeae8; --sel:#e8f2e6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#121a14; --card:#1b261d; --text:#e6efe7; --muted:#9db0a0; --border:#34473a;
    --accent:#66bb6a; --accent-text:#0c1a0e; --ok:#7fdc8a; --ok-bg:#1c3a22;
    --bad:#ff8a80; --bad-bg:#3d1f1c; --sel:#25382a;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#121a14; --card:#1b261d; --text:#e6efe7; --muted:#9db0a0; --border:#34473a;
  --accent:#66bb6a; --accent-text:#0c1a0e; --ok:#7fdc8a; --ok-bg:#1c3a22;
  --bad:#ff8a80; --bad-bg:#3d1f1c; --sel:#25382a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:800px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0}
button{font:inherit;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin:14px 0}
.card.ok{border-color:var(--ok);background:linear-gradient(var(--ok-bg),var(--ok-bg)) }
.card.bad{border-color:var(--bad)}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.num{font-weight:700;color:var(--accent)}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--border);color:var(--muted)}
.q{margin:0 0 10px;font-weight:600}
.opt{display:flex;gap:10px;align-items:center;padding:10px 12px;margin:6px 0;border:1px solid var(--border);border-radius:10px;cursor:pointer;min-height:44px}
.opt:has(input:checked){background:var(--sel);border-color:var(--accent)}
.opt input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
input[type=text],select{font:inherit;width:100%;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
table{width:100%;border-collapse:collapse}
td{padding:6px 8px 6px 0;vertical-align:middle;border-top:1px solid var(--border)}
td:first-child{width:40%;font-weight:500}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.95rem}
.card.ok .fb{background:var(--ok-bg);color:var(--ok)}
.card.bad .fb{background:var(--bad-bg);color:var(--bad)}
.fb b{display:block}
.mark{font-weight:600}
.rowbad{color:var(--bad)}
.rowok{color:var(--ok)}
#score{display:none;text-align:center;font-size:1.2rem;font-weight:700}
@media (max-width:520px){
  .wrap{padding:12px}
  td:first-child{width:auto}
  table,tbody,tr,td{display:block;width:100%}
  td{border:0;padding:2px 0}
  tr{padding:8px 0;border-top:1px solid var(--border)}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Oefentoets: Organen van planten</h1>
      <p class="sub">Thema 2 Organen en cellen, basisstof 2 &middot; <span id="count"></span> vragen</p>
    </div>
    <button id="themeBtn" type="button" aria-label="Wissel tussen licht en donker">Donker</button>
  </header>

  <div class="bar">
    <button class="primary" id="checkBtn" type="button">Nakijken</button>
    <button id="resetBtn" type="button">Opnieuw</button>
    <button id="newBtn" type="button">Nieuwe vragen</button>
  </div>

  <div id="score" class="card" role="status"></div>
  <div id="quiz"></div>
  <div class="bar"><button class="primary" id="checkBtn2" type="button">Nakijken</button></div>
</div>

<script>
(function(){
"use strict";

/* ---------- Vragenpool (alles uit het PDF) ---------- */
// mc: eerste optie is juist; fill: a = geaccepteerde antwoorden
var POOL = [
 // Meerkeuze
 {t:"mc",q:"Welk orgaan(stelsel) neemt water en mineralen op uit de bodem?",o:["Het wortelstelsel","De stengel","Het blad","De bladsteel"],e:"Het wortelstelsel neemt met de wortelharen water en mineralen op uit de bodem."},
 {t:"mc",q:"Wat zit aan de uiteinden van de zijwortels?",o:["Wortelharen","Vaatbundels","Bladmoes","Reservestoffen"],e:"Aan de uiteinden van de zijwortels zitten de wortelharen."},
 {t:"mc",q:"Wat is de functie van het blad?",o:["Voedsel maken voor de plant (fotosynthese)","Water opnemen uit de bodem","De plant vastzetten in de grond","Reservestoffen opslaan"],e:"Bladeren maken voedsel voor de plant door fotosynthese."},
 {t:"mc",q:"Wat zijn mineralen?",o:["Zouten: voedingsstoffen die opgelost zijn in het bodemwater","Stoffen die de plant opslaat om later te gebruiken","Lange dunne buisjes in de plant","Het platte deel van het blad"],e:"Mineralen zijn zouten: voedingsstoffen voor de plant, opgelost in het water in de bodem."},
 {t:"mc",q:"Bij de stengelproef zet je een witte anjer in water met rode kleurstof. Wat is de conclusie?",o:["De stengel vervoert water met opgeloste stoffen","De bloem maakt zelf de rode kleurstof","De stengel maakt voedsel voor de plant","Het water verdampt uit de reageerbuis"],e:"De bloem werd rood en het water zakte: de stengels vervoeren water met opgeloste stoffen."},
 {t:"mc",q:"Waarom gebruik je bij de stengelproef ook een reageerbuis zonder bloem?",o:["Als controle: om te testen dat het water niet uit de buis verdampt","Om te zien of de kleurstof zonder bloem rood blijft","Om de bloem extra water te geven","Om twee bloemen te kunnen vergelijken"],e:"De buis zonder bloem is de controle: daarmee test je dat het water niet uit de reageerbuis verdampt."},
 {t:"mc",q:"Welke planten hebben geen hoofdwortel of zijwortels?",o:["Bollen, zoals tulpen en uien","Bomen","Planten met een lange, dikke hoofdwortel","Kruidachtige planten"],e:"Bollen zoals tulpen en uien hebben geen hoofdwortel of zijwortels."},
 {t:"mc",q:"Hoe heet het platte gedeelte van een blad?",o:["Bladschijf","Bladsteel","Bladmoes","Hoofdnerf"],e:"De bladschijf is het platte gedeelte van het blad."},
 {t:"mc",q:"Hoe heet alles wat tussen de nerven van een blad zit?",o:["Bladmoes","Bladschijf","Bladsteel","Zijnerven"],e:"Alles tussen de nerven noem je het bladmoes."},
 {t:"mc",q:"Wat is kenmerkend voor een kruidachtige plant?",o:["Bijna geen hout; stevig zolang de wortels genoeg water opnemen","Een stevige stengel met veel hout","Geen wortels","Dikke zijwortels die over de bodem kronkelen"],e:"Kruidachtige planten hebben bijna geen hout en zijn alleen stevig als de wortels genoeg water kunnen opnemen."},
 {t:"mc",q:"Wat gebeurt er met een kruidachtige plant bij een tekort aan water?",o:["De bladeren en stengels worden slap","De stengel wordt harder door hout","De plant maakt extra zijwortels aan de stengel","De bladeren worden rood"],e:"Bij een tekort aan water worden de bladeren en stengels van een kruidachtige plant slap."},
 {t:"mc",q:"Wat is een vaatbundel?",o:["Een groepje vaten bij elkaar","Alle vaten van een plant samen","Een lange, dunne wortel","De nerven in het bladmoes"],e:"Een vaatbundel is een groepje vaten dat bij elkaar ligt. Alle vaten samen heten het vatenstelsel."},
 {t:"mc",q:"Welke stof gaat via het vatenstelsel van de bladeren naar de andere delen van de plant?",o:["Glucose","Water","Mineralen","Rode kleurstof"],e:"Glucose gaat van de bladeren naar de andere delen van de plant. Water en mineralen gaan juist van de wortels naar de rest."},
 {t:"mc",q:"Waar vind je vaatbundels in een plant?",o:["In de wortels, de stengel en de bladnerven","Alleen in de stengel","Alleen in de bladeren","Alleen in de wortels"],e:"Vaatbundels vind je in de wortels, de stengel en de bladeren (nerven)."},
 {t:"mc",q:"Welke twee functies hebben de nerven van een blad?",o:["Stevigheid geven en transport van water en andere stoffen","Voedsel maken en water opnemen","Het blad vastzetten en reservestoffen opslaan","Water opnemen en glucose maken"],e:"Nerven geven stevigheid aan het blad en zorgen voor transport van water en andere stoffen."},
 {t:"mc",q:"Hoe komt het water in het bladmoes?",o:["Via de stengel en de nerven","Via de bladsteel alleen","Via wortelharen in het blad","Uit de lucht via de bladschijf"],e:"De wortels nemen water op; via de stengel en de nerven komt het water in het bladmoes."},

 // Invullen
 {t:"fill",q:"Alle wortels van een plant samen noem je het ...",a:["wortelstelsel"],e:"Alle wortels samen heten het wortelstelsel (een orgaanstelsel)."},
 {t:"fill",q:"Met de ... neemt de plant water met mineralen op uit de bodem.",a:["wortelharen","wortelhaar"],e:"Met de wortelharen neemt de plant water met mineralen op."},
 {t:"fill",q:"Mineralen is een ander woord voor ...",a:["zouten","zout"],e:"Mineralen zijn zouten, opgelost in het bodemwater."},
 {t:"fill",q:"Stoffen die een plant opslaat om ze later te gebruiken heten ...",a:["reservestoffen","reservestof"],e:"Reservestoffen worden opgeslagen om later te gebruiken, bijvoorbeeld om in de lente snel te kunnen groeien."},
 {t:"fill",q:"Met de ... zit een blad vast aan de stengel.",a:["bladsteel"],e:"Met de bladsteel zit het blad vast aan de stengel."},
 {t:"fill",q:"De hoofdnerf loopt meestal in het midden van het blad. De aftakkingen van de hoofdnerf heten ...",a:["zijnerven","zijnerf"],e:"De aftakkingen van de hoofdnerf heten zijnerven."},
 {t:"fill",q:"De lange, dunne buisjes in een plant waarmee stoffen worden vervoerd heten ...",a:["vaten","vat"],e:"Vaten zijn lange, dunne buisjes in de plant voor transport."},
 {t:"fill",q:"Alle vaten van een plant samen noem je het ...",a:["vatenstelsel"],e:"Alle vaten samen heten het vatenstelsel. De functie ervan is transport."},
 {t:"fill",q:"Welke kleur kreeg de witte anjer na enkele dagen in de stengelproef?",a:["rood","rode"],e:"De bloem kleurde rood doordat de stengel het rode water vervoerde."},
 {t:"fill",q:"Het maken van voedsel in de groene delen van de plant heet ...",a:["fotosynthese"],e:"Fotosynthese is het maken van voedsel, vooral in de bladeren."},
 {t:"fill",q:"Een plant met een stevige stengel met veel hout (zoals een boom of struik) heet een ... plant.",a:["houtachtige","houtachtig"],e:"Bomen en struiken zijn houtachtige planten."},
 {t:"fill",q:"Een plant met bijna geen hout in de stengel heet een ... plant.",a:["kruidachtige","kruidachtig"],e:"Een kruidachtige plant heeft bijna geen hout in de stengel."},
 {t:"fill",q:"Welke plant sterft in de herfst af, maar groeit in de lente uit de wortel weer uit?",a:["paardenbloem","de paardenbloem"],e:"De wortel van de paardenbloem blijft leven en gebruikt reservestoffen om in de lente snel te groeien."},

 // Waar of onwaar
 {t:"tf",q:"Alle planten hebben wortels.",a:true,e:"Klopt: alle planten hebben wortels, maar ze zien er vaak anders uit."},
 {t:"tf",q:"Een ui heeft een hoofdwortel met zijwortels.",a:false,e:"Bollen zoals tulpen en uien hebben geen hoofdwortel of zijwortels."},
 {t:"tf",q:"Wortelharen zitten aan de uiteinden van de zijwortels.",a:true,e:"Klopt: wortelharen zitten aan de uiteinden van de zijwortels."},
 {t:"tf",q:"Door de stengel gaan alleen water en mineralen, nooit glucose.",a:false,e:"Door de stengel gaan water en mineralen van de wortels naar de bladeren, en glucose van de bladeren naar andere delen."},
 {t:"tf",q:"Fotosynthese vindt alleen plaats in de bladeren.",a:false,e:"Fotosynthese vindt plaats in alle groene delen van een plant, maar in de bladeren het meest."},
 {t:"tf",q:"Een kruidachtige plant bevat veel hout.",a:false,e:"Kruidachtige planten bevatten bijna geen hout."},
 {t:"tf",q:"De nerven van een blad bestaan uit vaatbundels.",a:true,e:"Klopt: ook de nerven van het blad bestaan uit vaatbundels."},
 {t:"tf",q:"De reageerbuis zonder bloem laat zien dat het water niet uit de buis verdampt.",a:true,e:"Klopt: dat is de controle bij de stengelproef."},
 {t:"tf",q:"De bladmoes is het deel waarmee het blad vastzit aan de stengel.",a:false,e:"Dat is de bladsteel. Bladmoes is alles tussen de nerven."},
 {t:"tf",q:"Doordat de wortels zich sterk vertakken, staat de plant stevig vast in de grond.",a:true,e:"Klopt: zo zetten de wortels de plant stevig vast."},
 {t:"tf",q:"Een paardenbloem gebruikt in de lente reservestoffen uit de wortel om snel te groeien.",a:true,e:"Klopt: de reservestoffen in de wortel worden dan verbruikt."},

 // Koppelvragen
 {t:"match",q:"Koppel elk orgaan(stelsel) aan zijn functie.",pairs:[
   ["Wortelstelsel","Water en mineralen opnemen, plant vastzetten, reservestoffen opslaan"],
   ["Stengel","Transport van stoffen en stevigheid geven"],
   ["Blad","Voedsel maken (fotosynthese)"],
   ["Vatenstelsel","Transport van water, mineralen en glucose"]],e:"Zie de tabel in de basisstof: wortelstelsel = opnemen, vastzetten en opslaan; stengel = transport en stevigheid; blad = voedsel maken; vatenstelsel = transport."},
 {t:"match",q:"Koppel elk begrip van het blad aan de juiste betekenis.",pairs:[
   ["Bladsteel","Deel waarmee het blad vastzit aan de stengel"],
   ["Bladschijf","Het platte gedeelte van het blad"],
   ["Nerven","Hoofdnerf en zijnerven; geven stevigheid en zorgen voor transport"],
   ["Bladmoes","Alles tussen de nerven"]],e:"Uit de begrippenlijst: bladsteel, bladschijf, nerven en bladmoes."},
 {t:"match",q:"Koppel elk begrip van de wortel aan de juiste betekenis.",pairs:[
   ["Hoofdwortel","Lange, dikke wortel waar de zijwortels aan zitten"],
   ["Zijwortels","Aftakkingen van de hoofdwortel"],
   ["Wortelharen","Zitten aan de uiteinden van de zijwortels; nemen water met mineralen op"],
   ["Wortelstelsel","Alle wortels van een plant samen"]],e:"Uit de begrippenlijst over wortels."},
 {t:"match",q:"Stengelproef met de anjer: koppel elke waarneming of vraag aan het juiste antwoord.",pairs:[
   ["De bloem na enkele dagen","Rood gekleurd"],
   ["Het water in de buis met bloem","Is gezakt"],
   ["Waarvoor is de buis zonder bloem?","Controle: het water verdampt niet uit de buis"],
   ["Conclusie van de proef","Stengels vervoeren water met opgeloste stoffen"]],e:"De bloem werd rood, het waterniveau zakte, de buis zonder bloem was de controle, en de conclusie is dat stengels water met opgeloste stoffen vervoeren."}
];

// Hoeveel vragen per type in een toets (samen 18)
var QUOTA = {mc:7, fill:5, tf:4, match:2};
var TAGS = {mc:"Meerkeuze", fill:"Invullen", tf:"Waar of onwaar", match:"Koppelen"};

/* ---------- Hulpfuncties ---------- */
function shuffle(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function norm(s){
  return String(s).toLowerCase().trim().replace(/\s+/g," ").replace(/[.!]+$/,"");
}

/* ---------- Toets opbouwen ---------- */
var test = [];
var checked = false;

function build(){
  var types = ["mc","fill","tf","match"];
  var picked = [];
  types.forEach(function(type){
    var items = POOL.filter(function(p){ return p.t === type; });
    picked = picked.concat(shuffle(items).slice(0, QUOTA[type]));
  });
  picked = shuffle(picked);
  return picked.map(function(p){
    var q = {t:p.t, q:p.q, e:p.e, a:p.a};
    if (p.t === "mc") {
      q.opts = shuffle(p.o.map(function(text, i){ return {text:text, ok:i === 0}; }));
    } else if (p.t === "match") {
      q.rows = shuffle(p.pairs);
      q.rights = shuffle(p.pairs.map(function(r){ return r[1]; }));
    }
    return q;
  });
}

function render(){
  checked = false;
  var quiz = document.getElementById("quiz");
  var html = "";
  test.forEach(function(q, i){
    html += '<section class="card" id="c' + i + '">';
    html += '<div class="qhead"><span class="num">Vraag ' + (i + 1) + '</span><span class="tag">' + TAGS[q.t] + '</span><span class="mark" id="m' + i + '"></span></div>';
    html += '<p class="q">' + esc(q.q) + '</p>';
    if (q.t === "mc") {
      q.opts.forEach(function(o, k){
        html += '<label class="opt"><input type="radio" name="q' + i + '" value="' + k + '"><span>' + esc(o.text) + '</span></label>';
      });
    } else if (q.t === "tf") {
      html += '<label class="opt"><input type="radio" name="q' + i + '" value="true"><span>Waar</span></label>';
      html += '<label class="opt"><input type="radio" name="q' + i + '" value="false"><span>Onwaar</span></label>';
    } else if (q.t === "fill") {
      html += '<input type="text" id="f' + i + '" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Typ je antwoord" aria-label="Antwoord vraag ' + (i + 1) + '">';
    } else if (q.t === "match") {
      html += '<table><tbody>';
      q.rows.forEach(function(r, k){
        html += '<tr><td>' + esc(r[0]) + '</td><td><select id="s' + i + '_' + k + '" aria-label="' + esc(r[0]) + '"><option value="">Kies...</option>';
        q.rights.forEach(function(opt){
          html += '<option value="' + esc(opt) + '">' + esc(opt) + '</option>';
        });
        html += '</select></td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '<div class="fb" id="fb' + i + '" hidden></div>';
    html += '</section>';
  });
  quiz.innerHTML = html;
  document.getElementById("count").textContent = test.length;
  var sc = document.getElementById("score");
  sc.style.display = "none";
  sc.textContent = "";
}

/* ---------- Nakijken ---------- */
function checkAll(){
  var score = 0;
  test.forEach(function(q, i){
    var ok = false, fb = "";
    var card = document.getElementById("c" + i);
    if (q.t === "mc") {
      var sel = document.querySelector('input[name="q' + i + '"]:checked');
      ok = !!sel && q.opts[+sel.value].ok;
      var right = q.opts.filter(function(o){ return o.ok; })[0].text;
      fb = (ok ? "" : "Juiste antwoord: " + right + ". ") + q.e;
    } else if (q.t === "tf") {
      var s2 = document.querySelector('input[name="q' + i + '"]:checked');
      ok = !!s2 && (s2.value === "true") === q.a;
      fb = (ok ? "" : "Juiste antwoord: " + (q.a ? "waar" : "onwaar") + ". ") + q.e;
    } else if (q.t === "fill") {
      var val = norm(document.getElementById("f" + i).value);
      var accepted = q.a.map(norm);
      ok = accepted.indexOf(val) !== -1;
      fb = (ok ? "" : "Juiste antwoord: " + q.a[0] + ". ") + q.e;
    } else if (q.t === "match") {
      var all = true, wrong = [];
      q.rows.forEach(function(r, k){
        var v = document.getElementById("s" + i + "_" + k).value;
        if (v !== r[1]) { all = false; wrong.push(r[0] + " = " + r[1]); }
      });
      ok = all;
      fb = (ok ? "" : "Juiste koppelingen: " + q.rows.map(function(r){ return r[0] + " = " + r[1]; }).join("; ") + ". ") + q.e;
    }
    if (ok) score++;
    card.className = "card " + (ok ? "ok" : "bad");
    document.getElementById("m" + i).textContent = ok ? "Goed" : "Fout";
    var box = document.getElementById("fb" + i);
    box.hidden = false;
    box.innerHTML = "<b>" + (ok ? "Goed!" : "Niet goed.") + "</b>" + esc(fb);
  });
  checked = true;
  var sc = document.getElementById("score");
  var pct = Math.round(score / test.length * 100);
  var msg = pct >= 75 ? "Goed gedaan!" : (pct >= 55 ? "Bijna: oefen de foute vragen nog even." : "Lees de basisstof nog eens door en probeer het opnieuw.");
  sc.textContent = "Score: " + score + " van " + test.length + " (" + pct + "%). " + msg;
  sc.style.display = "block";
  sc.scrollIntoView({behavior:"smooth", block:"start"});
}

/* ---------- Knoppen ---------- */
function newTest(){ test = build(); render(); window.scrollTo(0, 0); }
function resetTest(){ render(); window.scrollTo(0, 0); }

document.getElementById("checkBtn").addEventListener("click", checkAll);
document.getElementById("checkBtn2").addEventListener("click", checkAll);
document.getElementById("resetBtn").addEventListener("click", resetTest);
document.getElementById("newBtn").addEventListener("click", newTest);

/* ---------- Licht / donker ---------- */
var mq = window.matchMedia("(prefers-color-scheme: dark)");
var root = document.documentElement;
var themeBtn = document.getElementById("themeBtn");
function isDark(){
  var t = root.getAttribute("data-theme");
  return t ? t === "dark" : mq.matches;
}
function updateBtn(){ themeBtn.textContent = isDark() ? "Licht" : "Donker"; }
themeBtn.addEventListener("click", function(){
  root.setAttribute("data-theme", isDark() ? "light" : "dark");
  updateBtn();
});
if (mq.addEventListener) { mq.addEventListener("change", function(){ if (!root.getAttribute("data-theme")) updateBtn(); }); }
updateBtn();

newTest();
})();
</script>
</body>
</html>
