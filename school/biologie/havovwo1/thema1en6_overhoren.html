<style>
:root{
  --paper:#FBFCF8; --surface:#FFFFFF; --ink:#1E2A22; --muted:#5C6B60; --line:#DDE6D4; --dot:#DCE5D2;

  --good:#2F6B3A; --half:#B7860B; --bad:#B23A2E;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111813; --surface:#18221B; --ink:#E4ECE4; --muted:#9DAD9F; --line:#2C3A30; --dot:#223027;
    --leaf:#7CC48A; --leaf-ink:#0E1A11; --leaf-soft:#1F3324; --pollen:#F2C230; --pollen-soft:#3A3216;
    --good:#7CC48A; --half:#E6B640; --bad:#F08A7E; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111813; --surface:#18221B; --ink:#E4ECE4; --muted:#9DAD9F; --line:#2C3A30; --dot:#223027;
  --leaf:#7CC48A; --leaf-ink:#0E1A11; --leaf-soft:#1F3324; --pollen:#F2C230; --pollen-soft:#3A3216;
  --good:#7CC48A; --half:#E6B640; --bad:#F08A7E; color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; background:var(--paper); color:var(--ink);
  background-image:radial-gradient(var(--dot) 1.2px, transparent 1.3px); background-size:22px 22px;
  font-family:"Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif; font-size:1.0625rem; line-height:1.55;
}
.wrap{ max-width:46rem; margin:0 auto; padding:2.5rem 1.25rem 4rem; }
header h1{
  font-family:"Bricolage Grotesque", "Atkinson Hyperlegible", Arial, sans-serif; font-weight:800;
  font-size:clamp(2.1rem, 6vw, 3.2rem); line-height:1.02; letter-spacing:-0.02em; margin:0 0 .6rem;
}
header h1 span{ background:linear-gradient(transparent 58%, var(--pollen) 58%, var(--pollen) 90%, transparent 90%); padding:0 .1em; }
header p{ margin:.2rem 0; color:var(--muted); max-width:38rem; }
.bar{ display:flex; flex-wrap:wrap; gap:.75rem; align-items:center; margin:1.5rem 0 2rem; }
button{
  font:inherit; font-weight:700; border-radius:999px; padding:.7rem 1.3rem; cursor:pointer;
  border:2px solid var(--leaf); background:var(--leaf); color:var(--leaf-ink);
}
button.ghost{ background:transparent; color:var(--leaf); }
button:focus-visible, textarea:focus-visible{ outline:3px solid var(--pollen); outline-offset:2px; }
button:disabled{ opacity:.5; cursor:default; }
ol.qs{ list-style:none; margin:0; padding:0; counter-reset:q; }
li.q{
  counter-increment:q; position:relative; background:var(--surface); border:1px solid var(--line);
  border-radius:14px; padding:1.25rem 1.25rem 1.25rem 4.1rem; margin:0 0 1.1rem;
}
li.q::before{
  content:counter(q); position:absolute; left:1.1rem; top:1.1rem; width:2.2rem; height:2.2rem; border-radius:50%;
  display:grid; place-items:center; font-family:"Bricolage Grotesque", Arial, sans-serif; font-weight:800;
  background:var(--leaf-soft); color:var(--leaf);
}
.topic{ font-size:.85rem; color:var(--muted); margin:0 0 .25rem; }
.qtext{ font-weight:700; margin:0 0 .75rem; }
.q img{ display:block; max-width:100%; max-height:300px; margin:.25rem 0 .9rem; border-radius:8px; border:1px solid var(--line); background:#fff; }
textarea{
  width:100%; min-height:5.2rem; resize:vertical; font:inherit; color:var(--ink); background:var(--paper);
  border:1.5px solid var(--line); border-radius:10px; padding:.65rem .8rem;
}
.answer{ display:none; margin-top:.9rem; background:var(--pollen-soft); border-radius:10px; padding:.85rem 1rem; }
.checked .answer{ display:block; }
.answer h3{ margin:0 0 .3rem; font-size:.95rem; }
.answer p{ margin:0 0 .75rem; }
.mark{ display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; font-size:.92rem; }
.mark span{ color:var(--muted); margin-right:.25rem; }
.mark button{ padding:.35rem .9rem; font-size:.9rem; background:transparent; }
.mark button[data-v="1"]{ border-color:var(--good); color:var(--good); }
.mark button[data-v="0.5"]{ border-color:var(--half); color:var(--half); }
.mark button[data-v="0"]{ border-color:var(--bad); color:var(--bad); }
.mark button[aria-pressed="true"][data-v="1"]{ background:var(--good); color:var(--paper); }
.mark button[aria-pressed="true"][data-v="0.5"]{ background:var(--half); color:var(--paper); }
.mark button[aria-pressed="true"][data-v="0"]{ background:var(--bad); color:var(--paper); }
.score{
  display:none; margin:1.5rem 0 0; padding:1.1rem 1.25rem; border-radius:14px; background:var(--leaf); color:var(--leaf-ink);
}
.score.show{ display:block; }
.score strong{ font-family:"Bricolage Grotesque", Arial, sans-serif; font-size:1.6rem; }
.foot{ display:flex; flex-wrap:wrap; gap:.75rem; margin-top:1.25rem; }
.hint{ color:var(--muted); font-size:.92rem; margin-top:.75rem; }
@media (max-width:520px){ li.q{ padding:1.1rem 1rem 1.1rem 1rem; } li.q::before{ position:static; margin-bottom:.6rem; } }
@media print{ .bar, .foot, .mark, .hint{ display:none !important; } body{ background:#fff; } li.q{ break-inside:avoid; } }

<script>
const BANK = [{"t": "Groei en ontwikkeling", "q": "Wat is het verschil tussen groei en ontwikkeling?", "a": "Groei is het groter en zwaarder worden van een organisme. Ontwikkeling is een verandering in de bouw (vorm) van een organisme.", "img": null}, {"t": "Groei en ontwikkeling", "q": "Een jonge pinguïn uit het ei lijkt al veel op een volwassen pinguïn. Vindt na de geboorte vooral groei of vooral ontwikkeling plaats? Leg uit.", "a": "Vooral groei. In het ei heeft al veel ontwikkeling plaatsgevonden: de bouw lijkt al op die van de volwassen pinguïn. Na de geboorte wordt het jong vooral groter en zwaarder.", "img": "pinguin"}, {"t": "Groei en ontwikkeling", "q": "Wat is de functie van het poortje van een zaad?", "a": "Door het poortje kan het zaad snel water opnemen. Water is nodig voor de kieming.", "img": "boon"}, {"t": "Groei en ontwikkeling", "q": "Wat is de functie van de zaadhuid?", "a": "De zaadhuid beschermt het zaad.", "img": "boon"}, {"t": "Groei en ontwikkeling", "q": "Wat zit er in de zaadlobben en waarvoor is dat nodig?", "a": "In de zaadlobben zit reservevoedsel (voedingsstoffen). Het kiemplantje gebruikt die voedingsstoffen om te groeien.", "img": "boon"}, {"t": "Groei en ontwikkeling", "q": "Wanneer begint de kieming van een zaad?", "a": "De kieming begint als het zaad water opneemt.", "img": null}, {"t": "Groei en ontwikkeling", "q": "Wat is een levenscyclus?", "a": "De ontwikkeling van een zaad tot een plant en daarna tot een vrucht met zaden. Een cyclus vindt steeds opnieuw plaats: het einde van de ene cyclus is het begin van de volgende.", "img": "cyclus"}, {"t": "Groei en ontwikkeling", "q": "De levenscyclus van een tomatenplant deel je in drie fasen. Noem de drie fasen.", "a": "Kieming (stap 2 en 3), kiemplantje (stap 4, 5 en 6) en volwassen plant (stap 7, 8 en 9).", "img": "cyclus"}, {"t": "Groei en ontwikkeling", "q": "Geef een voorbeeld van ontwikkeling bij een plant en leg uit waarom dat nuttig is.", "a": "Bijvoorbeeld: de wortels vertakken zich. Daardoor kan de plant beter water opzuigen uit de bodem. (Ook goed: er ontstaan nieuwe delen zoals stengels, bladeren en bloemen.)", "img": null}, {"t": "Voedsel maken", "q": "Welke drie dingen heeft een plant nodig om glucose te maken?", "a": "Water, koolstofdioxide en energie uit licht.", "img": null}, {"t": "Voedsel maken", "q": "Schrijf de fotosynthese op als een ‘woordformule’.", "a": "water + koolstofdioxide + energie uit licht → glucose + zuurstof", "img": "foto"}, {"t": "Voedsel maken", "q": "Waar haalt een plant water vandaan, en waar koolstofdioxide?", "a": "Water haalt de plant met zijn wortels uit de bodem. Koolstofdioxide haalt hij uit de lucht, via kleine openingen in de bladeren.", "img": "foto"}, {"t": "Voedsel maken", "q": "Geef twee redenen waarom fotosynthese belangrijk is voor mensen.", "a": "1. Door fotosynthese ontstaat voedsel: vrijwel alles wat we eten komt uiteindelijk van planten. 2. Door fotosynthese ontstaat zuurstof, die we inademen.", "img": null}, {"t": "Voedsel maken", "q": "Een ei komt van een kip. Leg met de afbeelding uit waarom ook een ei eigenlijk dankzij fotosynthese bestaat.", "a": "De kip heeft maïs gegeten. Maïs is een plant die door fotosynthese is gegroeid. Dus ook het ei komt uiteindelijk van een plant.", "img": "belang"}, {"t": "Voedsel maken", "q": "In welke delen van de plant vindt fotosynthese plaats?", "a": "In alle groene delen van de plant, vooral in de bladeren.", "img": null}, {"t": "Voedsel maken", "q": "Wat is glucose en waarvoor gebruikt de plant het?", "a": "Glucose is een soort suiker met veel energie. De plant maakt er andere stoffen van, waaruit hij bestaat. Zo kan hij groeien en nieuwe delen maken.", "img": null}, {"t": "Voedsel maken", "q": "Van welk deel van de plant eet je bij een winterpeen, bij asperges en bij sla?", "a": "Winterpeen: de wortel. Asperges: de stengel. Sla: de bladeren.", "img": null}, {"t": "Allemaal anders", "q": "Wat is een aanpassing?", "a": "Een eigenschap van een organisme waardoor het een functie (zoals ademhaling, beweging, voeding, verdediging of voortplanting) beter kan vervullen in zijn leefomgeving.", "img": null}, {"t": "Allemaal anders", "q": "Welke aanpassing hebben de pinguïn, de haai en de dolfijn gemeen? Leg uit waarom die handig is.", "a": "Ze zijn gestroomlijnd: kop, romp en staart gaan geleidelijk in elkaar over. Daardoor hebben ze weinig weerstand in het water.", "img": "water"}, {"t": "Allemaal anders", "q": "Noem twee aanpassingen van een vis aan het leven in het water.", "a": "Bijvoorbeeld: kieuwen om te ademen; vinnen om rechtop te blijven; schubben met slijm (gladde huid, weinig weerstand); een gestroomlijnde vorm.", "img": null}, {"t": "Allemaal anders", "q": "Welke plant groeit in een droge omgeving, de linker of de rechter? Leg uit aan de bladeren en de wortels.", "a": "De rechter. Die heeft kleine, dikke bladeren die goed vocht vasthouden, en veel (grote) wortels om water te vinden.", "img": "droog"}, {"t": "Allemaal anders", "q": "Waarom groeien de meeste waterplanten in de bovenste laag van het water?", "a": "Omdat planten licht nodig hebben voor fotosynthese. Bovenin het water is het meeste licht.", "img": null}, {"t": "Allemaal anders", "q": "Kijk naar vogel 3. Welk type snavel heeft hij en waarvoor is die geschikt?", "a": "Een haaksnavel. Die is scherp en geschikt om prooidieren in stukken te scheuren.", "img": "snavels"}, {"t": "Allemaal anders", "q": "Hoe eet een eend met een zeefsnavel?", "a": "Hij neemt water in zijn bek en perst dat langs de ‘zeef’ naar buiten. Het plankton (heel kleine diertjes en plantjes) blijft achter en dat slikt hij in.", "img": "snavels"}, {"t": "Allemaal anders", "q": "Wat is het verschil tussen een zoolganger, een teenganger en een topganger? Geef bij elk een voorbeeld.", "a": "Zoolganger: loopt op de hele voetzool (beer, mens). Teenganger: loopt op de tenen (kat). Topganger: loopt op de toppen van de tenen met hoeven (paard).", "img": null}, {"t": "Allemaal anders", "q": "Noem drie manieren waarop dieren zich verdedigen tegen vijanden.", "a": "Bijvoorbeeld: stekels (egel), schutkleur (bladstaartgekko, tong), er gevaarlijk uitzien (sabelsprinkhaan), een schild (schildpad), een gifstekel (schorpioen).", "img": "verdediging"}, {"t": "Allemaal anders", "q": "Hoe verdedigen bramen, brandnetels en de koffieplant zich?", "a": "Bramen: stekels op de stengels. Brandnetels: brandharen op de bladeren. Koffieplant: een gifstof (cafeïne) die insecten verlamt.", "img": null}, {"t": "Bloemen", "q": "Wat is de functie van bloemen?", "a": "Voortplanting.", "img": null}, {"t": "Bloemen", "q": "Wat is de functie van de kelkbladeren als de bloem nog in de knop zit?", "a": "Ze beschermen de rest van de bloem tegen uitdroging en kou.", "img": null}, {"t": "Bloemen", "q": "Waarom hebben veel planten grote, opvallend gekleurde kroonbladeren?", "a": "Om insecten te lokken. Die zorgen voor de bestuiving.", "img": "kroon"}, {"t": "Bloemen", "q": "Uit welke twee delen bestaat een meeldraad? En wat ontstaat er in de helmhokjes?", "a": "Een meeldraad bestaat uit een helmdraad en een helmknop. In de helmhokjes ontstaat stuifmeel (pollen).", "img": "bloem"}, {"t": "Bloemen", "q": "Noem de drie delen van een stamper, van boven naar beneden.", "a": "Stempel, stijl en vruchtbeginsel.", "img": "bloem"}, {"t": "Bloemen", "q": "Wat is het mannelijke en wat is het vrouwelijke voortplantingsorgaan van een bloem?", "a": "Mannelijk: de meeldraden. Vrouwelijk: de stamper.", "img": null}, {"t": "Bloemen", "q": "Wat zijn de geslachtscellen van een plant? Noem de mannelijke en de vrouwelijke.", "a": "Mannelijk: stuifmeelkorrels. Vrouwelijk: eicellen (in de zaadbeginsels).", "img": null}, {"t": "Bestuiving", "q": "Wat is bestuiving?", "a": "Het overbrengen van stuifmeel van een meeldraad op een stempel van een bloem van dezelfde plantensoort.", "img": null}, {"t": "Bestuiving", "q": "Wat is het verschil tussen zelfbestuiving en kruisbestuiving?", "a": "Zelfbestuiving: stuifmeel komt op de stempel van dezelfde bloem of van een andere bloem aan dezelfde plant. Kruisbestuiving: stuifmeel komt op een bloem van een andere plant van dezelfde soort.", "img": null}, {"t": "Bestuiving", "q": "Leg uit hoe een insect een bloem bestuift.", "a": "Het insect komt af op de kleur, geur en nectar. Stuifmeel blijft aan zijn lichaam kleven. In de volgende bloem komt het insect met zijn lichaam tegen de stempel en blijft er stuifmeel aan de stempel plakken.", "img": "insect"}, {"t": "Bestuiving", "q": "Is dit een insectenbloem of een windbloem? Noem twee kenmerken die je daarbij helpen.", "a": "Een windbloem (gras). Kenmerken: kleine, onopvallende groene bloemen; helmknoppen hangen buiten de bloem; grote, veervormige stempels steken buiten de bloem uit.", "img": "gras"}, {"t": "Bestuiving", "q": "Waarom maken windbloemen veel meer stuifmeel dan insectenbloemen?", "a": "Het stuifmeel komt bij toeval op een stempel van dezelfde soort terecht. Die kans is klein, dus er is veel stuifmeel nodig.", "img": null}, {"t": "Bestuiving", "q": "Een bij brengt stuifmeel van een roos naar een lelie. Is dat bestuiving? Leg uit.", "a": "Nee. Het stuifmeel moet op de stempel van een bloem van dezelfde plantensoort komen. Een roos en een lelie zijn verschillende soorten.", "img": null}, {"t": "Bestuiving", "q": "Wat is nectar en waarom maken bloemen het?", "a": "Nectar is een zoet sap. Het trekt insecten aan, zodat die voor de bestuiving zorgen.", "img": null}, {"t": "Bevruchting", "q": "Wat is bevruchting?", "a": "Het versmelten van de kern van een mannelijke geslachtscel met de kern van een vrouwelijke geslachtscel.", "img": null}, {"t": "Bevruchting", "q": "Beschrijf hoe de kern van een stuifmeelkorrel bij de eicel komt.", "a": "Uit de stuifmeelkorrel op de stempel groeit een stuifmeelbuis. Die groeit door de stijl naar een zaadbeginsel. Door de buis gaat de kern van de stuifmeelkorrel naar het zaadbeginsel. De top barst open en de kern versmelt met de kern van de eicel.", "img": "bevruchting"}, {"t": "Bevruchting", "q": "Wat ontstaat er na de bevruchting uit de bevruchte eicel, en wat uit het zaadbeginsel?", "a": "Uit de bevruchte eicel ontstaat door celdelingen een kiem. Uit het zaadbeginsel ontstaat een zaad.", "img": "mungboon"}, {"t": "Bevruchting", "q": "Hoe kan het dat er meerdere zaden in één vruchtbeginsel ontstaan?", "a": "Er kunnen meerdere stuifmeelbuizen tegelijk door de stijl groeien, elk naar een ander zaadbeginsel. Elke bevruchte eicel kan een zaad worden.", "img": null}, {"t": "Bevruchting", "q": "Wat gebeurt er met een zaadbeginsel als de eicel erin niet wordt bevrucht?", "a": "Dan kan de eicel niet uitgroeien tot een kiem, en groeit het zaadbeginsel niet uit tot een zaad.", "img": null}, {"t": "Bevruchting", "q": "De kern van een bevruchte eicel bevat chromosomen. Van wie komen die?", "a": "Van de mannelijke geslachtscel (stuifmeelkorrel) én van de vrouwelijke geslachtscel (eicel).", "img": null}, {"t": "Vruchten en zaden", "q": "Uit welk deel van de bloem ontstaat een vrucht? En uit welk deel ontstaan de zaden?", "a": "De vrucht ontstaat uit het vruchtbeginsel. De zaden ontstaan uit de zaadbeginsels (met een bevruchte eicel).", "img": null}, {"t": "Vruchten en zaden", "q": "Hoe heet de vrucht van een bonenplant? Wat gebeurt er met de kroonbladeren en meeldraden na de bevruchting?", "a": "Een peulvrucht. De kroonbladeren en meeldraden vallen af.", "img": "peul"}, {"t": "Vruchten en zaden", "q": "Uit welk deel van de bloem ontstaat het vruchtvlees van een appel?", "a": "Uit de bloembodem. Het vruchtbeginsel wordt het klokhuis met de pitten (zaden).", "img": "appel"}, {"t": "Vruchten en zaden", "q": "Is een tomaat een vrucht of een zaad? En de pitjes erin?", "a": "Een tomaat is een vrucht. De pitjes zijn de zaden.", "img": null}, {"t": "Vruchten en zaden", "q": "Wat is vruchtvlees?", "a": "Het zachte, soms eetbare deel van een vrucht. Het ontstaat uit het vruchtbeginsel of uit de bloembodem.", "img": null}, {"t": "Vruchten en zaden", "q": "Waarom kunnen mensen en dieren zich voeden met zaden?", "a": "Een zaad bevat reservevoedsel voor het kiemplantje. Met dat reservevoedsel kunnen ook mensen en dieren zich voeden.", "img": null}, {"t": "Vruchten en zaden", "q": "Een meloen heeft meer dan honderd zaden. Hoeveel bevruchtingen zijn daarvoor nodig geweest? Leg uit.", "a": "Meer dan honderd: voor elk zaad is de kern van een eicel versmolten met de kern van een stuifmeelkorrel.", "img": null}, {"t": "Verspreiding van zaden", "q": "Waarom is het nuttig voor een plant dat zijn zaden worden verspreid?", "a": "Dan komen ze niet allemaal op dezelfde plek terecht, waardoor meer zaden kunnen kiemen.", "img": null}, {"t": "Verspreiding van zaden", "q": "Hoe worden de zaden van een paardenbloem verspreid, en welk hulpmiddel hebben ze daarvoor?", "a": "Door de wind. Elke vrucht heeft een pluisje, waardoor hij lang in de lucht blijft zweven.", "img": "paardenbloem"}, {"t": "Verspreiding van zaden", "q": "Hoe verspreidt de ooievaarsbek zijn zaden?", "a": "Door de plant zelf: de vruchten springen open als ze rijp zijn en slingeren de zaden weg.", "img": "ooievaarsbek"}, {"t": "Verspreiding van zaden", "q": "Hoe zorgt een vogel die bessen van een lijsterbes eet ervoor dat de zaden worden verspreid?", "a": "Het vruchtvlees wordt verteerd, maar de zaden niet. Die komen met de uitwerpselen ergens anders terecht en kunnen daar kiemen.", "img": null}, {"t": "Verspreiding van zaden", "q": "Hoe worden de vruchten van de klis verspreid?", "a": "Door dieren: de vruchten hebben kleine haakjes en blijven in de vacht hangen. Later vallen ze eraf of worden ze afgeveegd.", "img": "klis"}, {"t": "Verspreiding van zaden", "q": "Hoe kan een eekhoorn ervoor zorgen dat er een nieuwe eik groeit?", "a": "Eekhoorns leggen wintervoorraden aan van eikels. Soms vinden ze een voorraad niet terug. Die eikels kunnen dan kiemen.", "img": null}, {"t": "Verspreiding van zaden", "q": "Noem drie bomen waarvan de vruchten vleugels hebben.", "a": "Berk, esdoorn en linde.", "img": null}, {"t": "Verspreiding van zaden", "q": "Hoe verspreiden mensen soms zaden zonder dat ze het doorhebben?", "a": "Zaden blijven hangen in de ribbels van schoenzolen en vallen er op een andere plek weer af.", "img": null}];

const list = document.getElementById('list');
const scoreBox = document.getElementById('score');
const checkBtn = document.getElementById('check');
let current = [];

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(){
  const topics=[...new Set(BANK.map(q=>q.t))];
  const chosen=[];
  // één vraag per onderwerp, daarna aanvullen tot tien
  shuffle(topics.slice()).forEach(t=>{ chosen.push(shuffle(BANK.filter(q=>q.t===t))[0]); });
  const rest=shuffle(BANK.filter(q=>!chosen.includes(q)));
  while(chosen.length<10 && rest.length) chosen.push(rest.shift());
  // volgorde van de onderwerpen aanhouden
  const order=[...new Set(BANK.map(q=>q.t))];
  return chosen.sort((a,b)=>order.indexOf(a.t)-order.indexOf(b.t));
}
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function render(){
  current=pick();
  list.innerHTML=current.map((q,i)=>`
    <li class="q" id="q${i}">
      <p class="topic">${esc(q.t)}</p>
      <p class="qtext">${esc(q.q)}</p>
      ${q.img?`<img src="${IMGS[q.img]}" alt="Afbeelding bij vraag ${i+1}">`:''}
      <label class="sr" for="a${i}" style="position:absolute;left:-9999px">Jouw antwoord op vraag ${i+1}</label>
      <textarea id="a${i}" placeholder="Jouw antwoord…"></textarea>
      <div class="answer">
        <h3>Goed antwoord</h3>
        <p>${esc(q.a)}</p>
        <div class="mark" role="group" aria-label="Punten voor vraag ${i+1}">
          <span>Had je het goed?</span>
          <button type="button" data-v="1" aria-pressed="false">Goed</button>
          <button type="button" data-v="0.5" aria-pressed="false">Half goed</button>
          <button type="button" data-v="0" aria-pressed="false">Fout</button>
        </div>
      </div>
    </li>`).join('');
  scoreBox.classList.remove('show');
  checkBtn.textContent='Nakijken';
  window.scrollTo({top:0, behavior:'smooth'});
}
function updateScore(){
  const items=[...list.querySelectorAll('li.q')];
  let pts=0, done=0;
  items.forEach(li=>{ const on=li.querySelector('.mark button[aria-pressed="true"]'); if(on){ done++; pts+=parseFloat(on.dataset.v); } });
  if(!done){ scoreBox.innerHTML='Geef jezelf bij elke vraag punten met de knoppen <em>Goed</em>, <em>Half goed</em> of <em>Fout</em>.'; }
  else {
    const cijfer=Math.max(1, Math.round((1+9*pts/items.length)*10)/10);
    scoreBox.innerHTML=`<strong>${String(pts).replace('.',',')} van de ${items.length} punten</strong><br>`+
      (done<items.length?`Nog ${items.length-done} ${items.length-done===1?'vraag':'vragen'} zonder punten.`:`Dat is ongeveer een ${String(cijfer).replace('.',',')}.`);
  }
  scoreBox.classList.add('show');
}
checkBtn.addEventListener('click',()=>{
  list.querySelectorAll('li.q').forEach(li=>li.classList.add('checked'));
  checkBtn.textContent='Nagekeken';
  updateScore();
  document.getElementById('q0').scrollIntoView({behavior:'smooth', block:'start'});
});
list.addEventListener('click',e=>{
  const b=e.target.closest('.mark button'); if(!b) return;
  b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false'));
  updateScore();
});
document.getElementById('new').addEventListener('click',render);
render();
</script>
</body>
